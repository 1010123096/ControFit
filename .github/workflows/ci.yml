name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Run k6 performance tests'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  unit:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ControlFit.sln

      - name: Build
        run: dotnet build ControlFit.Api/ControlFit.Api.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: >-
          dotnet test ControlFit.Tests/ControlFit.Tests.csproj
          --no-restore --configuration Release
          --filter "FullyQualifiedName~Domain|FullyQualifiedName~Application|FullyQualifiedName~Api|FullyQualifiedName~Infrastructure"
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: >-
          reportgenerator
          -reports:ControlFit.Tests/TestResults/**/coverage.cobertura.xml
          -targetdir:coverage-report
          -reporttypes:Html

      - name: Coverage summary
        if: always()
        run: |
          COVERAGE_FILE=$(find . -path '*/TestResults/*/coverage.cobertura.xml' | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            export COVERAGE_FILE; python3 -c "import xml.etree.ElementTree as ET, os, sys; t=ET.parse(os.environ['COVERAGE_FILE']); r=t.getroot(); pairs=[(c.get('filename',''),l) for c in r.iter('class') for l in c.iter('line')]; pairs=[(fn,l) for fn,l in pairs if '/Migrations' not in fn and 'Program.cs' not in fn]; tc=len(pairs); cc=sum(1 for _,l in pairs if l.get('hits')!='0'); p=cc*100/tc if tc else 0; m='## Backend Code Coverage (app+domain+api)\n| Metric | Value |\n|--------|-------|\n| Lines | **'+format(p,'.1f')+'%** ('+str(cc)+'/'+str(tc)+') |'; open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(m+'\n'); print('::error::Coverage '+format(p,'.1f')+'% is below 75% threshold') if p<75 else None; exit(1 if p<75 else 0)"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-coverage
          path: coverage-report/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Tests/ControlFit.Tests.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: >-
          dotnet test ControlFit.Tests/ControlFit.Tests.csproj
          --configuration Release --no-restore
          --filter "FullyQualifiedName~Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --collect:"XPlat Code Coverage"
        env:
          INTEGRATION_TEST_CONNECTION: >-
            Server=localhost;User Id=sa;Password=Test123!;TrustServerCertificate=true;MultipleActiveResultSets=true

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        if: always()
        run: >-
          reportgenerator
          -reports:ControlFit.Tests/TestResults/**/coverage.cobertura.xml
          -targetdir:coverage-report
          -reporttypes:Html

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-coverage
          path: coverage-report/

  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Restore & Build
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Tests/ControlFit.Tests.csproj --configuration Release --no-restore

      - name: Mutation - Domain
        run: dotnet stryker --config-file "stryker-config-domain.json"
        continue-on-error: true

      - name: Mutation - Application
        run: dotnet stryker --config-file "stryker-config-application.json"
        continue-on-error: true

      - name: Mutation - Infrastructure
        run: dotnet stryker --config-file "stryker-config-infrastructure.json"
        continue-on-error: true

      - name: Mutation - API
        run: dotnet stryker --config-file "stryker-config-api.json"
        continue-on-error: true

      - name: Upload mutation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: StrykerOutput/

  performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance == 'true')
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Build & Start API
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Api/ControlFit.Api.csproj --configuration Release --no-restore
          dotnet run --project ControlFit.Api/ControlFit.Api.csproj --configuration Release --urls "http://0.0.0.0:5219" &
        env:
          ConnectionStrings__DefaultConnection: >-
            Server=localhost;Database=FitControl;User Id=sa;Password=Test123!;TrustServerCertificate=true;MultipleActiveResultSets=true

      - name: Wait for API readiness
        run: |
          echo "Waiting for API to start..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:5219/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo "000")
            if [ "${code:0:1}" = "2" ] || [ "${code:0:1}" = "4" ]; then
              echo "API ready (HTTP $code)"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Seed database
        run: |
          echo "Seeding database..."
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5219/api/seed)
          if [ "$code" = "200" ]; then
            echo "Seed OK (HTTP $code)"
          else
            echo "Seed FAILED (HTTP $code)"
            exit 1
          fi

      - name: Smoke test
        continue-on-error: true
        run: >-
          k6 run tests/performance/smoke.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-smoke.json
          --no-usage-report || true

      - name: Login load test
        continue-on-error: true
        run: >-
          k6 run tests/performance/login.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-login.json
          --no-usage-report || true

      - name: Stress test
        continue-on-error: true
        run: >-
          k6 run tests/performance/stress.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-stress.json
          --no-usage-report || true

      - name: Generate HTML report
        if: always()
        run: node tests/performance/generate-report.js performance-*.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            performance-*.json
            performance-report.html

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    needs: [unit, integration, mutation, performance]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-unit-coverage
          path: reports/unit-coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: backend-integration-coverage
          path: reports/integration-coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: mutation-reports
          path: reports/mutation
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: performance-reports
          path: reports/performance
        continue-on-error: true

      - name: Generate index.html
        run: |
          cat > reports/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>ControFit — Backend Reports</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 32px; max-width: 960px; margin: 0 auto; }
            h1 { color: #58a6ff; margin-bottom: 8px; font-size: 2rem; }
            p { color: #8b949e; margin-bottom: 24px; }
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
            .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-decoration: none; color: inherit; display: block; transition: border-color .2s; }
            .card:hover { border-color: #58a6ff; }
            .card h2 { color: #f0f6fc; font-size: 1.1rem; margin-bottom: 6px; }
            .card p { color: #8b949e; font-size: .85rem; margin: 0; }
            .card .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 600; margin-top: 8px; }
            .status.found { background: #0f2d1a; color: #3fb950; }
            .status.missing { background: #2d0f0f; color: #f85149; }
          </style>
          </head>
          <body>
          <h1>ControFit — Backend Reports</h1>
          <p>Commit <code>${{ github.sha }}</code> · <code>${{ github.ref_name }}</code></p>
          <div class="grid">
            <a class="card" href="unit-coverage/index.htm" target="_blank">
              <h2>Unit Test Coverage</h2>
              <p>HTML report from ReportGenerator</p>
              <span class="status found">View</span>
            </a>
            <a class="card" href="integration-coverage/index.htm" target="_blank">
              <h2>Integration Coverage</h2>
              <p>HTML report from ReportGenerator</p>
              <span class="status found">View</span>
            </a>
            <a class="card" href="mutation/index.html" target="_blank">
              <h2>Mutation Tests</h2>
              <p>Stryker.NET mutation score report</p>
              <span class="status found">View</span>
            </a>
            <a class="card" href="performance/performance-report.html" target="_blank">
              <h2>Performance (k6)</h2>
              <p>k6 load test HTML report</p>
              <span class="status found">View</span>
            </a>
          </div>
          </body>
          </html>
          HTML

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dashboard
          path: reports/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
