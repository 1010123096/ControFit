name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Run k6 performance tests'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  unit:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ControlFit.sln

      - name: Build
        run: dotnet build ControlFit.Api/ControlFit.Api.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: >-
          dotnet test ControlFit.Tests/ControlFit.Tests.csproj
          --no-restore --configuration Release
          --filter "FullyQualifiedName~Domain|FullyQualifiedName~Application|FullyQualifiedName~Api|FullyQualifiedName~Infrastructure"
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: >-
          reportgenerator
          -reports:ControlFit.Tests/TestResults/**/coverage.cobertura.xml
          -targetdir:coverage-report
          -reporttypes:Html

      - name: Coverage summary
        if: always()
        run: |
          COVERAGE_FILE=$(find . -path '*/TestResults/*/coverage.cobertura.xml' | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_RATE=$(grep -o 'line-rate="[^"]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9.]*')
            BRANCH_RATE=$(grep -o 'branch-rate="[^"]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9.]*')
            LINES_COVERED=$(grep -o 'lines-covered="[^"]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9]*')
            LINES_VALID=$(grep -o 'lines-valid="[^"]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9]*')
            LINE_PCT=$(echo "scale=1; $LINE_RATE * 100" | bc)
            BRANCH_PCT=$(echo "scale=1; $BRANCH_RATE * 100" | bc)
            echo "## Backend Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | **${LINE_PCT}%** ($LINES_COVERED/$LINES_VALID) |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | **${BRANCH_PCT}%** |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-coverage
          path: coverage-report/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Tests/ControlFit.Tests.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: >-
          dotnet test ControlFit.Tests/ControlFit.Tests.csproj
          --configuration Release --no-restore
          --filter "FullyQualifiedName~Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --collect:"XPlat Code Coverage"
        env:
          INTEGRATION_TEST_CONNECTION: >-
            Server=localhost;User Id=sa;Password=Test123!;TrustServerCertificate=true;MultipleActiveResultSets=true

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        if: always()
        run: >-
          reportgenerator
          -reports:ControlFit.Tests/TestResults/**/coverage.cobertura.xml
          -targetdir:coverage-report
          -reporttypes:Html

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-coverage
          path: coverage-report/

  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Restore & Build
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Tests/ControlFit.Tests.csproj --configuration Release --no-restore

      - name: Mutation - Domain
        run: dotnet stryker --config-file "stryker-config-domain.json"
        continue-on-error: true

      - name: Mutation - Application
        run: dotnet stryker --config-file "stryker-config-application.json"
        continue-on-error: true

      - name: Mutation - Infrastructure
        run: dotnet stryker --config-file "stryker-config-infrastructure.json"
        continue-on-error: true

      - name: Mutation - API
        run: dotnet stryker --config-file "stryker-config-api.json"
        continue-on-error: true

      - name: Upload mutation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: StrykerOutput/

  performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance == 'true')
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Build & Start API
        run: |
          dotnet restore ControlFit.sln
          dotnet build ControlFit.Api/ControlFit.Api.csproj --configuration Release --no-restore
          dotnet run --project ControlFit.Api/ControlFit.Api.csproj --configuration Release --urls "http://0.0.0.0:5219" &
        env:
          ConnectionStrings__DefaultConnection: >-
            Server=localhost;Database=FitControl;User Id=sa;Password=Test123!;TrustServerCertificate=true;MultipleActiveResultSets=true

      - name: Wait for API readiness
        run: |
          echo "Waiting for API to start..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:5219/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo "000")
            if [ "${code:0:1}" = "2" ] || [ "${code:0:1}" = "4" ]; then
              echo "API ready (HTTP $code)"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Seed database
        run: |
          echo "Seeding database..."
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5219/api/seed)
          if [ "$code" = "200" ]; then
            echo "Seed OK (HTTP $code)"
          else
            echo "Seed FAILED (HTTP $code)"
            exit 1
          fi

      - name: Smoke test
        continue-on-error: true
        run: >-
          k6 run tests/performance/smoke.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-smoke.json
          --no-usage-report

      - name: Login load test
        continue-on-error: true
        run: >-
          k6 run tests/performance/login.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-login.json
          --no-usage-report

      - name: Stress test
        continue-on-error: true
        run: >-
          k6 run tests/performance/stress.test.js
          --env BASE_URL="http://localhost:5219/api"
          --summary-export performance-stress.json
          --no-usage-report

      - name: Generate HTML report
        if: always()
        run: node tests/performance/generate-report.js performance-*.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            performance-*.json
            performance-report.html
